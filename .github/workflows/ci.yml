name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/speech-server/web/package-lock.json
      - name: Build web UI
        run: |
          cd crates/speech-server/web
          npm ci
          npm run build
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy (gpu feature)
        run: ORT_STRATEGY=system cargo clippy -p speech-server --features gpu --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  # Окремий джоб: desktop-оболонка Tauri 2 поза кореневим workspace
  # (потрібні GTK/WebKit системні бібліотеки).
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/speech-server/web/package-lock.json
      - name: Build web UI (вбудовується в desktop-бінарник)
        run: |
          cd crates/speech-server/web
          npm ci
          npm run build
      - name: Install Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Format
        run: cargo fmt --manifest-path desktop/src-tauri/Cargo.toml -- --check
      - name: Clippy
        run: cargo clippy --manifest-path desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Test (компілює та лінкує бінарник з GTK/WebKit)
        run: cargo test --manifest-path desktop/src-tauri/Cargo.toml

  # Пакування desktop-інсталяторів (deb + AppImage) із вбудованим
  # speech-server і libonnxruntime.so.1: артефакти на кожен push у main,
  # GitHub Release — на тегах v*. Збірка на ubuntu-24.04 (glibc 2.39),
  # щоб пакети запускалися на Debian 13 / Ubuntu 24.04+.
  package:
    needs: [test, desktop]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: package
          workspaces: |
            .
            desktop/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/speech-server/web/package-lock.json
      - name: Build web UI (вбудовується в desktop-бінарник)
        run: |
          cd crates/speech-server/web
          npm ci
          npm run build
      - name: Install Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Cache ONNX Runtime
        id: ort-cache
        uses: actions/cache@v4
        with:
          path: ~/ort
          key: ort-1.31.0-linux-x64
      - name: Install ONNX Runtime 1.31.0
        if: steps.ort-cache.outputs.cache-hit != 'true'
        run: |
          curl -fsSL -o /tmp/ort.tgz \
            "https://github.com/microsoft/onnxruntime/releases/download/v1.31.0/onnxruntime-linux-x64-1.31.0.tgz"
          mkdir -p "$HOME/ort"
          tar -xzf /tmp/ort.tgz -C "$HOME/ort" --strip-components=1
          rm /tmp/ort.tgz
      - name: Build speech-server (release)
        # ort v1.16.3 з дефолтною download-стратегією тягне ORT 1.16
        # (max IR version 9), а моделі Morkon/holos-native-models — IR 10:
        # сервер падає з "Unsupported model IR version: 10". Лінкуємо
        # системний ORT 1.31.0 (як deploy/Dockerfile та локальні тести);
        # SONAME ORT 1.31 = libonnxruntime.so.1 = DT_NEEDED speech-server.
        run: ORT_STRATEGY=system ORT_LIB_LOCATION="$HOME/ort/lib" cargo build --release -p speech-server
      - name: Stage sidecars (speech-server + libonnxruntime)
        # externalBin вимагає файли з суфіксом target triple; бандлер прибирає
        # суфікс, тож у пакеті вони ляжуть поруч як speech-server і
        # libonnxruntime.so.1.
        run: |
          mkdir -p desktop/src-tauri/bin
          cp target/release/speech-server \
            desktop/src-tauri/bin/speech-server-x86_64-unknown-linux-gnu
          chmod +x desktop/src-tauri/bin/speech-server-x86_64-unknown-linux-gnu
          so="$HOME/ort/lib/libonnxruntime.so.1.31.0"
          if [ ! -f "$so" ]; then
            echo "ORT lib not found: $so"
            ls -la "$HOME/ort/lib" || true
            exit 1
          fi
          echo "staging $so"
          cp "$so" \
            desktop/src-tauri/bin/libonnxruntime.so.1-x86_64-unknown-linux-gnu
      - name: Build installer (deb only - AppImage disabled due to FUSE issues in CI)
        working-directory: desktop/src-tauri
        env:
          TAURI_LOG: debug
        run: npx --yes "@tauri-apps/cli@^2" build --bundles deb
      - uses: actions/upload-artifact@v4
        with:
          name: promin-desktop-linux-x64
          path: desktop/src-tauri/target/release/bundle/deb/*.deb
          if-no-files-found: error
      - name: Publish GitHub Release (теги v*)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
