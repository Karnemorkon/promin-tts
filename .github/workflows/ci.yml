name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/speech-server/web/package-lock.json
      - name: Build web UI
        run: |
          cd crates/speech-server/web
          npm ci
          npm run build
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy (gpu feature)
        run: ORT_STRATEGY=system cargo clippy -p speech-server --features gpu --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  # Окремий джоб: desktop-оболонка Tauri 2 поза кореневим workspace
  # (потрібні GTK/WebKit системні бібліотеки).
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/speech-server/web/package-lock.json
      - name: Build web UI (вбудовується в desktop-бінарник)
        run: |
          cd crates/speech-server/web
          npm ci
          npm run build
      - name: Install Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Format
        run: cargo fmt --manifest-path desktop/src-tauri/Cargo.toml -- --check
      - name: Clippy
        run: cargo clippy --manifest-path desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Test (компілює та лінкує бінарник з GTK/WebKit)
        run: cargo test --manifest-path desktop/src-tauri/Cargo.toml

  # Пакування desktop-інсталяторів (deb + AppImage) із вбудованим
  # speech-server і libonnxruntime.so.1: артефакти на кожен push у main,
  # GitHub Release — на тегах v*. Збірка на ubuntu-24.04 (glibc 2.39),
  # щоб пакети запускалися на Debian 13 / Ubuntu 24.04+.
  package:
    needs: [test, desktop]
    if: github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: package
          workspaces: |
            .
            desktop/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/speech-server/web/package-lock.json
      - name: Build web UI (вбудовується в desktop-бінарник)
        run: |
          cd crates/speech-server/web
          npm ci
          npm run build
      - name: Install Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Build speech-server (release)
        run: cargo build --release -p speech-server
      - name: Stage sidecars (speech-server + libonnxruntime)
        # externalBin вимагає файли з суфіксом target triple; бандлер прибирає
        # суфікс, тож у пакеті вони ляжуть поруч як speech-server і
        # libonnxruntime.so.1. ort (download-стратегія) копіює поруч із
        # бінарником профілю libonnxruntime.so та версійний .so.X — але не
        # .so.1, якого вимагає NEEDED speech-server; ім'я створюємо самі.
        run: |
          mkdir -p desktop/src-tauri/bin
          cp target/release/speech-server \
            desktop/src-tauri/bin/speech-server-x86_64-unknown-linux-gnu
          chmod +x desktop/src-tauri/bin/speech-server-x86_64-unknown-linux-gnu
          so=""
          for candidate in \
            target/release/libonnxruntime.so.1 \
            target/release/libonnxruntime.so \
            target/release/libonnxruntime.so.*; do
            if [ -f "$candidate" ]; then so="$candidate"; break; fi
          done
          if [ -z "$so" ]; then
            echo "libonnxruntime not found under target/release:"
            ls -la target/release/libonnxruntime* || true
            find target -name 'libonnxruntime.so*' -maxdepth 4 || true
            exit 1
          fi
          echo "staging $so"
          cp "$so" \
            desktop/src-tauri/bin/libonnxruntime.so.1-x86_64-unknown-linux-gnu
      - name: Install FUSE + AppImage dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            fuse libfuse2 \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev \
            patchelf desktop-file-utils
      - name: Pre-extract linuxdeploy + appimage plugin to tauri cache (avoids FUSE)
        env:
          APPIMAGE_EXTRACT_AND_RUN: 1
        run: |
          mkdir -p ~/.cache/tauri
          cd ~/.cache/tauri
          # linuxdeploy
          curl -fsSLO https://github.com/tauri-apps/binary-releases/releases/download/linuxdeploy-07333c6/linuxdeploy-x86_64.AppImage
          chmod +x linuxdeploy-x86_64.AppImage
          ./linuxdeploy-x86_64.AppImage --appimage-extract
          mv squashfs-root linuxdeploy-07333c6-x86_64
          mv linuxdeploy-07333c6-x86_64/usr/bin/linuxdeploy linuxdeploy-07333c6-x86_64.AppImage
          rm -rf linuxdeploy-07333c6-x86_64
          # linuxdeploy-plugin-appimage (also an AppImage needing FUSE)
          curl -fsSLO https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-x86_64.AppImage
          chmod +x linuxdeploy-plugin-appimage-x86_64.AppImage
          ./linuxdeploy-plugin-appimage-x86_64.AppImage --appimage-extract
          mv squashfs-root linuxdeploy-plugin-appimage
          mv linuxdeploy-plugin-appimage/usr/bin/linuxdeploy-plugin-appimage linuxdeploy-plugin-appimage.AppImage
          rm -rf linuxdeploy-plugin-appimage
      - name: Build installers (deb + AppImage)
        working-directory: desktop/src-tauri
        env:
          TAURI_LOG: debug
          LINUXDEPLOY_VERBOSE: 1
        run: npx --yes "@tauri-apps/cli@^2" build
      - uses: actions/upload-artifact@v4
        with:
          name: promin-desktop-linux-x64
          path: |
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
          if-no-files-found: error
      - name: Publish GitHub Release (теги v*)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            desktop/src-tauri/target/release/bundle/deb/*.deb
            desktop/src-tauri/target/release/bundle/appimage/*.AppImage
