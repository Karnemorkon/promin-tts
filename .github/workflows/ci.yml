name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/speech-server/web/package-lock.json
      - name: Build web UI
        run: |
          cd crates/speech-server/web
          npm ci
          npm run build
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Clippy (gpu feature)
        run: ORT_STRATEGY=system cargo clippy -p speech-server --features gpu --all-targets -- -D warnings
      - name: Test
        run: cargo test --workspace

  # Окремий джоб: desktop-оболонка Tauri 2 поза кореневим workspace
  # (потрібні GTK/WebKit системні бібліотеки).
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: crates/speech-server/web/package-lock.json
      - name: Build web UI (вбудовується в desktop-бінарник)
        run: |
          cd crates/speech-server/web
          npm ci
          npm run build
      - name: Install Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Format
        run: cargo fmt --manifest-path desktop/src-tauri/Cargo.toml -- --check
      - name: Clippy
        run: cargo clippy --manifest-path desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Test (компілює та лінкує бінарник з GTK/WebKit)
        run: cargo test --manifest-path desktop/src-tauri/Cargo.toml
