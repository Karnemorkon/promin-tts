[workspace]
resolver = "2"
members = [
    "crates/speech-core",
    "crates/speech-text",
    "crates/speech-inference",
    "crates/speech-audio",
    "crates/speech-server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Karnemorkon/promin-tts"
rust-version = "1.80"

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
fancy-regex = "0.19"
hound = "3.5"
ndarray = "0.15"
ort = { git = "https://github.com/pykeio/ort", tag = "v1.16.3" }
rsmarisa = "0.4"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization = "0.1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
