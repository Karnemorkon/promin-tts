[workspace]
resolver = "2"
members = [
    "crates/speech-core",
    "crates/speech-text",
    "crates/speech-inference",
    "crates/speech-asr",
    "crates/speech-audio",
    "crates/speech-export",
    "crates/speech-server",
]

[workspace.package]
version = "0.14.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/Karnemorkon/promin-tts"
rust-version = "1.88"

[workspace.dependencies]
anyhow = "1"
asr-features = { version = "0.1.3", features = ["frontend"] }
async-stream = "0.3"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
ebur128 = { version = "0.1.10", features = ["precision-true-peak"] }
encoding_rs = "0.8"
fancy-regex = "0.19"
flacenc = { version = "0.5.1", default-features = false }
futures-util = "0.3"
hound = "3.5"
html-escape = "0.2"
id3-core = "0.3.1"
mp4-core = "0.3.2"
mp4io = "0.1.2"
ndarray = "0.15"
ogg = "0.9.2"
ort = { git = "https://github.com/pykeio/ort", tag = "v1.16.3" }
pdf-extract = "0.12.1"
quick-xml = "0.42"
regex = "1"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
rsmarisa = "0.4"
sentencepiece = { version = "0.14", features = ["static"] }
sha2 = "0.10"
rusty_aac = "2.0.1"
rusty_mp3 = "1.0.5"
rusty-opus = "1.0.2"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v4"] }
url = "2"
zip = { version = "9.1.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
