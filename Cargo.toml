[workspace]
resolver = "2"
members = [
    "crates/speech-core",
    "crates/speech-text",
    "crates/speech-inference",
    "crates/speech-audio",
    "crates/speech-server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = "https://github.com/Morkon/promin-tts"
rust-version = "1.80"

[workspace.dependencies]
anyhow = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
