# GPU profile: NVIDIA CUDA (requires NVIDIA Container Toolkit on the host).
# NOT testable on AVX-only hosts without a discrete GPU.
services:
  promin-tts:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: morkon06/promin-tts:gpu
    container_name: promin-tts
    ports:
      - "8010:8010"
      - "10200:10200"
    environment:
      - PROMIN_HTTP_ADDR=0.0.0.0:8010
      - PROMIN_WYOMING_ADDR=0.0.0.0:10200
      - PROMIN_MODELS_DIR=/data/models
      - PROMIN_SPEAKERS_DIR=/data/speakers
      - PROMIN_JOBS_DIR=/data/jobs
      - PROMIN_PROJECTS_DIR=/data/projects
      - PROMIN_JOBS_CONCURRENCY=${PROMIN_JOBS_CONCURRENCY:-1}
      - PROMIN_LOUDNESS_TARGET=${PROMIN_LOUDNESS_TARGET:--19}
      - PROMIN_TRUE_PEAK=${PROMIN_TRUE_PEAK:--3}
      - PROMIN_PUBLIC_URL=${PROMIN_PUBLIC_URL:-http://localhost:8010}
      - PROMIN_API_KEYS=${PROMIN_API_KEYS:-}
      - PROMIN_AUTO_DOWNLOAD=${PROMIN_AUTO_DOWNLOAD:-auto}
      - PROMIN_DOWNLOAD_OPTIONAL=${PROMIN_DOWNLOAD_OPTIONAL:-1}
      # Back-ASR (W2V-BERT) quality control; model auto-downloaded on first verify.
      - PROMIN_ASR_MODEL_DIR=/data/asr/w2v-bert-v3
      - PROMIN_ASR_THREADS=4
      - PROMIN_ASR_AUTO_DOWNLOAD=${PROMIN_ASR_AUTO_DOWNLOAD:-auto}
      - PROMIN_QC_CONCURRENCY=${PROMIN_QC_CONCURRENCY:-1}
      - PROMIN_QC_MAX_SEGMENT_MS=${PROMIN_QC_MAX_SEGMENT_MS:-25000}
      - PROMIN_QC_WER_WARN=${PROMIN_QC_WER_WARN:-0.10}
      - PROMIN_QC_WER_FAIL=${PROMIN_QC_WER_FAIL:-0.25}
      - PROMIN_QC_CER_WARN=${PROMIN_QC_CER_WARN:-0.05}
      - PROMIN_QC_CER_FAIL=${PROMIN_QC_CER_FAIL:-0.15}
      - RUST_LOG=info
    volumes:
      - promin_models:/data/models
      - promin_speakers:/data/speakers
      - promin_jobs:/data/jobs
      - promin_projects:/data/projects
      - promin_asr:/data/asr
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  promin_models:
  promin_speakers:
  promin_jobs:
  promin_projects:
  promin_asr:
