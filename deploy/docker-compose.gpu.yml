# GPU profile: NVIDIA CUDA (requires NVIDIA Container Toolkit on the host).
# NOT testable on AVX-only hosts without a discrete GPU.
services:
  promin-tts:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    image: morkon06/promin-tts:gpu
    container_name: promin-tts
    ports:
      - "8010:8010"
      - "10200:10200"
    environment:
      - PROMIN_HTTP_ADDR=0.0.0.0:8010
      - PROMIN_WYOMING_ADDR=0.0.0.0:10200
      - PROMIN_MODELS_DIR=/data/models
      - PROMIN_SPEAKERS_DIR=/data/speakers
      - PROMIN_JOBS_DIR=/data/jobs
      - PROMIN_JOBS_CONCURRENCY=${PROMIN_JOBS_CONCURRENCY:-1}
      - PROMIN_PUBLIC_URL=${PROMIN_PUBLIC_URL:-http://localhost:8010}
      - PROMIN_API_KEYS=${PROMIN_API_KEYS:-}
      - PROMIN_AUTO_DOWNLOAD=${PROMIN_AUTO_DOWNLOAD:-auto}
      - PROMIN_DOWNLOAD_OPTIONAL=${PROMIN_DOWNLOAD_OPTIONAL:-1}
      - RUST_LOG=info
    volumes:
      - promin_models:/data/models
      - promin_speakers:/data/speakers
      - promin_jobs:/data/jobs
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  promin_models:
  promin_speakers:
  promin_jobs:
