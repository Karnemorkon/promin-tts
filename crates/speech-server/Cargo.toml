[package]
name = "speech-server"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Axum HTTP server: REST, WebSocket, OpenAI-compatible API"

[[bin]]
name = "speech-server"
path = "src/main.rs"

[[bin]]
name = "promin-mcp"
path = "src/bin/promin-mcp.rs"

[dependencies]
speech-audio = { path = "../speech-audio" }
speech-asr = { path = "../speech-asr" }
speech-core = { path = "../speech-core" }
speech-export = { path = "../speech-export" }
speech-inference = { path = "../speech-inference" }
speech-text = { path = "../speech-text", features = ["import"] }

anyhow.workspace = true
async-stream.workspace = true
base64.workspace = true
futures-util.workspace = true
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
thiserror.workspace = true
uuid.workspace = true
url.workspace = true
axum = { version = "0.8", features = ["multipart"] }
clap = { version = "4", features = ["derive", "env"] }
rust-embed = "8"
tower-http = { version = "0.5", features = ["cors"] }

[dev-dependencies]
hound.workspace = true
